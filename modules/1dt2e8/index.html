<style>
  /* sayac-sekmeli — Rakamlar aynı anda değil, tek tek odaklanarak gösterilir (sekme etkileşimi); her rakam kendi paneline sahiptir. */
  .modulex-sayac-sekmeli { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-sekmeli *, .modulex-sayac-sekmeli *::before, .modulex-sayac-sekmeli *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-sekmeli :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-sekmeli :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-sekmeli :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-sekmeli :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-sekmeli img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-sekmeli) img { height: auto; }
  .modulex-sayac-sekmeli [hidden] { display: none !important; }
  .modulex-sayac-sekmeli :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-sekmeli :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-sekmeli-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-sekmeli-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-sekmeli--bassiz .modulex-sayac-sekmeli-bas { display: none; }
  .modulex-sayac-sekmeli-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-sekmeli-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-sekmeli-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-sekmeli-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-sayac-sekmeli-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-sekmeli-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-sekmeli-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-sekmeli-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-sekmeli-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-sekmeli-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-sekmeli-duzen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: clamp(24px, 4vw, 56px); align-items: stretch; }
  .modulex-sayac-sekmeli:not(.modulex-sayac-sekmeli--js) .modulex-sayac-sekmeli-sekmeler { display: none; }
  .modulex-sayac-sekmeli:not(.modulex-sayac-sekmeli--js) .modulex-sayac-sekmeli-duzen { grid-template-columns: minmax(0, 1fr); }
  .modulex-sayac-sekmeli-sekmeler { display: grid; align-content: start; gap: 6px; }
  .modulex-sayac-sekmeli-sekme { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 18px; border: 0; border-inline-start: 3px solid transparent; border-radius: 0 12px 12px 0; background: transparent; color: --muted--; font: inherit; font-size: 1.05rem; font-weight: 600; text-align: start; transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  [dir="rtl"] .modulex-sayac-sekmeli-sekme { border-radius: 12px 0 0 12px; }
  .modulex-sayac-sekmeli-sekme:hover { color: --text--; background: --kartBg--; }
  .modulex-sayac-sekmeli-sekme[aria-selected="true"] { border-inline-start-color: --accent--; background: --kartBg--; color: --text--; }
  .modulex-sayac-sekmeli-sekme-no { color: --accentInk--; font-size: 0.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .modulex-sayac-sekmeli-paneller { display: grid; gap: 16px; }
  .modulex-sayac-sekmeli-panel { display: grid; align-content: center; gap: 12px; min-height: 320px; padding: clamp(28px, 5vw, 56px); border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --kartBg--; animation: modulex-sayac-sekmeli-gel 0.45s ease both; }
  .modulex-sayac-sekmeli-ikon { color: --accentInk--; font-size: 44px; }
  .modulex-sayac-sekmeli-sayi { font-size: clamp(3.4rem, 8vw, 6.4rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 0.95; }
  .modulex-sayac-sekmeli-ek { color: --accentInk--; font-size: 0.45em; }
  .modulex-sayac-sekmeli-etiket { font-size: 1.3rem; font-weight: 700; }
  .modulex-sayac-sekmeli-not { color: --muted--; font-size: 1.02rem; }
  @keyframes modulex-sayac-sekmeli-gel { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (max-width: 768px) {
    .modulex-sayac-sekmeli-duzen { grid-template-columns: minmax(0, 1fr); }
    .modulex-sayac-sekmeli-sekmeler { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; scrollbar-width: none; }
    .modulex-sayac-sekmeli-sekme { border-inline-start: 0; border-block-end: 3px solid transparent; border-radius: 12px 12px 0 0; white-space: nowrap; padding: 12px 14px; }
    [dir="rtl"] .modulex-sayac-sekmeli-sekme { border-radius: 12px 12px 0 0; }
    .modulex-sayac-sekmeli-sekme[aria-selected="true"] { border-block-end-color: --accent--; }
    .modulex-sayac-sekmeli-panel { min-height: 0; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-sekmeli :is(.modulex-sayac-sekmeli-baslik, .modulex-sayac-sekmeli-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-sekmeli-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-sekmeli { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-sekmeli *, .modulex-sayac-sekmeli *::before, .modulex-sayac-sekmeli *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-sekmeli";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
    });
  })();
</script>
