<section class="modulex-iletisim-ray{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-iletisim-ray-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* iletisim-ray — Çok kanallı (şube, departman satırları) işletmede dikey yer kaplamadan tüm kanalları gösterir. */
  .modulex-iletisim-ray { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-iletisim-ray *, .modulex-iletisim-ray *::before, .modulex-iletisim-ray *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-ray :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-iletisim-ray :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-iletisim-ray :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-iletisim-ray :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-ray img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-iletisim-ray) img { height: auto; }
  .modulex-iletisim-ray [hidden] { display: none !important; }
  .modulex-iletisim-ray :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-iletisim-ray :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-iletisim-ray-ic { max-width: --max--; margin-inline: auto; }
  .modulex-iletisim-ray-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-iletisim-ray--bassiz .modulex-iletisim-ray-bas { display: none; }
  .modulex-iletisim-ray-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-iletisim-ray-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-iletisim-ray-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-iletisim-ray-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-iletisim-ray-ust { grid-column: 1 / -1; }
  .modulex-iletisim-ray-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-iletisim-ray-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-iletisim-ray-dugme:hover { transform: translateY(-2px); }
  .modulex-iletisim-ray-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-iletisim-ray-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-iletisim-ray-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-iletisim-ray-ray { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-block: 4px 12px; scrollbar-width: thin; }
  .modulex-iletisim-ray-kart { flex: 0 0 min(300px, 82%); scroll-snap-align: start; display: grid; align-content: start; gap: 10px; padding: 26px 22px; border: 1px solid --cizgi--; border-block-start: 4px solid --accent--; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-ray-kart .modulex-iletisim-ray-kikon { margin-block-end: 6px; }
  .modulex-iletisim-ray-kart .modulex-iletisim-ray-eylem { margin-block-start: auto; padding-block-start: 6px; }
  .modulex-iletisim-ray-kontrol { display: flex; justify-content: flex-end; gap: 10px; margin-block-start: 14px; }
  .modulex-iletisim-ray-ok { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid --cizgi--; border-radius: 50%; background: --bg--; color: --text--; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-ray-ok:hover:not(:disabled) { border-color: --accent--; }
  .modulex-iletisim-ray-ok:disabled { color: --muted--; cursor: default; }
  .modulex-iletisim-ray-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-ray-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-ray-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-ray-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-ray-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-ray-eylem:hover { gap: 10px; }
  .modulex-iletisim-ray-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-ray-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-ray--kjs .modulex-iletisim-ray-kopya { display: inline-flex; }
  .modulex-iletisim-ray-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-ray-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-ray--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-ray-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-ray-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-ray-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-ray-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-ray-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-ray-cikon { font-size: 18px; }
  .modulex-iletisim-ray-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-ray-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-ray-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-ray-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-ray-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-ray-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-ray-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-ray-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-ray-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-ray :is(.modulex-iletisim-ray-baslik, .modulex-iletisim-ray-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-ray-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-iletisim-ray-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-iletisim-ray { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-ray *, .modulex-iletisim-ray *::before, .modulex-iletisim-ray *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-ray";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ray = (s, P) => {
        const ray = s.querySelector("." + P + "-ray");
        if (!ray) return;
        const dugme = [...s.querySelectorAll("[data-ray]")];
        const durum = () => {
          const max = ray.scrollWidth - ray.clientWidth - 2;
          const x = Math.abs(ray.scrollLeft);
          dugme.forEach((b) => { b.disabled = max <= 0 || (b.dataset.ray === "geri" ? x <= 2 : x >= max); });
        };
        dugme.forEach((b) => b.addEventListener("click", () => {
          const ilk = ray.firstElementChild;
          const adim = (ilk ? ilk.getBoundingClientRect().width : ray.clientWidth * 0.8) + 16;
          const rtl = getComputedStyle(ray).direction === "rtl";
          ray.scrollBy({ left: (b.dataset.ray === "ileri" ? 1 : -1) * (rtl ? -1 : 1) * adim, behavior: "smooth" });
        }));
        ray.addEventListener("scroll", durum, { passive: true });
        durum();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ray(s, P, az);
    });
  })();
</script>
